<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q2 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: lightblue;
        }

        h1 {
            background-color: white;
            text-align: center;
            padding: 10px;
        }

        h5 {
            background-color: yellow;
            padding: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row">

            <h1>🏸 Beginner's Guide to Badminton</h1>
            <br>
            <div class="text-center">
                🏸
            </div>
            <br>
            <div class="row gap-3">

                <div class="col bg-light text-dark">

                    <h5>Basic Rules</h5>
                    <ul>
                        <li>Serve diagonally</li>
                        <li>Do not touch the net</li>
                        <li>Keep the shuttle in bounds</li>
                        <li>Score points</li>
                    </ul>
                </div>
                <div class="col bg-light text-dark">
                    <h5>Equipment</h5>
                    <ul>
                        <li>Racket</li>
                        <li>Shuttlecock</li>
                        <li>Net</li>
                        <li>Court</li>
                    </ul>
                </div>
                <div class="col bg-light text-dark">

                    <h5>Basic Techniques</h5>

                    <ul>
                        <li>Forehand</li>
                        <li>Backhand</li>
                        <li>Serve</li>
                        <li>Smash</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
